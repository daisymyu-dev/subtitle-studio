name: Verify Windows portable build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Create isolated build environment
        shell: pwsh
        run: |
          python -m venv .build/venv
          .build/venv/Scripts/python.exe -m pip install --index-url https://pypi.org/simple -r requirements-build.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # Source regressions cover optional ASR. Core packaging still excludes it.
          .build/venv/Scripts/python.exe -m pip install --index-url https://pypi.org/simple -r requirements-asr.txt -c requirements-lock.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Source regressions
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .work/tmp | Out-Null
          $env:TEMP = $env:TMP = (Resolve-Path .work/tmp).Path
          $env:PYTHONUTF8 = '1'
          .build/venv/Scripts/python.exe -m unittest discover -s tests -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node --test tests/*.js
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Bundle with official Node license
        shell: pwsh
        run: |
          $node = (Get-Command node.exe).Source
          $license = Join-Path (Split-Path $node) LICENSE
          if (-not (Test-Path $license)) { $license = .\scripts\prepare-node-license.ps1 -NodePath $node }
          .\scripts\build-windows.ps1 -NodePath $node -NodeLicensePath $license
      - name: Offline frozen smoke
        shell: pwsh
        run: .build/venv/Scripts/python.exe scripts/smoke-windows.py --executable dist/SubtitleStudio-Core/SubtitleStudio.exe --port 8767
      # This workflow verifies only. The release owner reviews native-code licenses
      # and publishes the final ZIP separately; no unreviewed binary is uploaded.
