name: Source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install declared dependencies
        shell: pwsh
        run: |
          python -m pip install --index-url https://pypi.org/simple -r requirements-build.txt -r requirements-asr.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Audit tracked source
        shell: pwsh
        run: python scripts/check-release.py
      - name: Python regressions
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .work/tmp | Out-Null
          $env:TEMP = (Resolve-Path .work/tmp).Path
          $env:TMP = $env:TEMP
          $env:PYTHONIOENCODING = 'utf-8'
          python -m unittest discover -s tests -q
      - name: JavaScript regressions
        shell: pwsh
        run: node --test tests/*.js
